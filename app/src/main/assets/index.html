<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trust No One — Flat 2.0</title>
<style>
:root{
  --bg:#07060a;
  --ink:#f5f3f8;
  --dim:#b6b1c2;
  --muted:#7f7a8d;
  --line:#221e2b;
  --line2:#2f2939;
  --s1:#0f0d15;
  --s2:#16131f;
  --s3:#1d1926;
  --red:#e01e46;
  --red2:#ff4d6d;
  --deep:#7a0f27;
  --gold:#f0c96b;
  --green:#31d17f;
  --blue:#5fb3f5;
  --violet:#a97bff;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:16px;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  min-height:100dvh;overscroll-behavior:none;
  background-image:
    radial-gradient(130% 60% at 50% -12%, rgba(224,30,70,.22), transparent 62%),
    radial-gradient(80% 40% at 8% 108%, rgba(169,123,255,.10), transparent 60%),
    radial-gradient(80% 40% at 95% 100%, rgba(95,179,245,.07), transparent 60%);
  background-attachment:fixed;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:80;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
#app{max-width:540px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));min-height:100dvh;position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.94}
p{margin:0 0 12px;line-height:1.55}
button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
a{color:var(--blue)}

/* type */
.tXL{font-size:clamp(46px,15.5vw,74px);line-height:.82;text-transform:uppercase;letter-spacing:-.045em;font-weight:800}
.tL{font-size:clamp(30px,8.6vw,42px);text-transform:uppercase;line-height:.92;letter-spacing:-.03em}
.tM{font-size:22px;text-transform:uppercase;letter-spacing:-.01em}
.tS{font-size:17px;font-weight:800;letter-spacing:-.01em}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.lede{font-size:16.5px;color:var(--dim);line-height:1.55}
.sm{font-size:13.5px;color:var(--dim);line-height:1.55}
.xs{font-size:11.5px;color:var(--muted);line-height:1.5}
.mono{font-family:var(--mono)}
.red{color:var(--red2)}.gold{color:var(--gold)}.green{color:var(--green)}.blue{color:var(--blue)}.vio{color:var(--violet)}.dimc{color:var(--muted)}
.cap{text-transform:uppercase}
.ctr{text-align:center}

/* layout */
.stack{display:flex;flex-direction:column;gap:11px}
.stack.tight{gap:8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rule{height:1px;background:var(--line);margin:16px 0;border:0}
.gap{height:16px}
.gap.lg{height:26px}

/* buttons */
.btn{display:block;width:100%;padding:17px 18px;border-radius:14px;background:var(--s2);
  border:1px solid var(--line2);font-weight:700;font-size:16px;text-align:center;
  transition:transform .09s ease,background .16s,border-color .16s;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(175deg,#f52a54,#a30f2c);border-color:#ff5c7c;
  box-shadow:0 14px 34px -18px rgba(224,30,70,1),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.g{background:linear-gradient(175deg,#f6d789,#c9a244);color:#1c1406;border-color:#f8e3a4;
  box-shadow:0 14px 34px -18px rgba(240,201,107,.9)}
.btn.ok{background:linear-gradient(175deg,#3ee08c,#1a9457);color:#04180d;border-color:#57eda0}
.btn.gh{background:transparent;border-color:var(--line)}
.btn.s{padding:13px 14px;font-size:14.5px;border-radius:12px}
.btn.xsb{padding:9px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.sel{border-color:var(--red2);background:#26101a;box-shadow:inset 0 0 0 1px var(--red2),0 0 0 4px rgba(224,30,70,.10)}
.btn.selg{border-color:var(--green);background:#0d2318;box-shadow:inset 0 0 0 1px var(--green)}
.btn .l{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.btn .l .r{font-weight:400;font-size:11.5px;color:var(--muted);text-align:right;flex-shrink:0}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.card.t{background:linear-gradient(180deg,var(--s2),var(--s1))}
.card.hot{border-color:#43141f;background:linear-gradient(180deg,#1c0d13,#100b11)}
.card.cool{border-color:#1b2c3a;background:linear-gradient(180deg,#0b131a,#0c0e13)}
.card.gld{border-color:#4b3d17;background:linear-gradient(180deg,#1a160b,#110f0a)}
.card.vi{border-color:#2f2148;background:linear-gradient(180deg,#150f22,#0f0c15)}
.card.grn{border-color:#194a30;background:linear-gradient(180deg,#0b1b13,#0b0f0c)}
.dossier{position:relative;border:1px solid #35202a;border-radius:var(--r);padding:20px 18px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 5px),linear-gradient(180deg,#141019,#0d0b11)}
.stamp{position:absolute;top:-9px;right:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
  color:#ff6b86;background:#180b10;border:1px solid #7d2137;padding:4px 8px;border-radius:4px;transform:rotate(2.5deg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  padding:5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--gold);border-color:#5a4a1e;background:#181307}
.pill.rd{color:var(--red2);border-color:#5c1a2a;background:#1a0b10}
.pill.gr{color:var(--green);border-color:#1c4a31;background:#08170f}
.redact{background:#2c2733;color:transparent;border-radius:4px;user-select:none;letter-spacing:.02em}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:#1c1826;color:var(--muted);margin:0 5px 5px 0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;min-height:34px}
.icb{padding:9px 12px;border:1px solid var(--line2);border-radius:11px;font-size:12.5px;background:var(--s1);font-weight:600}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.rail{display:flex;gap:4px;margin-bottom:18px}
.rail i{height:3px;flex:1;background:#221e2b;border-radius:99px}
.rail i.on{background:var(--red)}
.rail i.now{background:linear-gradient(90deg,var(--red),var(--gold))}

/* inputs */
input[type=text]{width:100%;padding:15px 14px;border-radius:13px;background:#0c0a11;border:1px solid var(--line2);
  color:var(--ink);font-size:17px;font-family:inherit;font-weight:600}
input::placeholder{color:#524d5e;font-weight:400}
.pRow{display:flex;gap:9px;align-items:center}
.pRow .del{padding:0 14px;height:52px;border-radius:12px;border:1px solid var(--line);color:#ff6b86;background:#160b10;font-size:18px}
.dot{width:11px;height:11px;border-radius:99px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--s2);
  border:1px solid var(--line2);font-size:14px;font-weight:700}
.chip.out{opacity:.38;text-decoration:line-through}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

/* switch */
.sw{width:50px;height:29px;border-radius:99px;background:#241f2e;border:1px solid var(--line2);position:relative;flex:0 0 50px}
.sw i{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:99px;background:#6d6779;transition:.18s}
.sw.on{background:#3d0f1e;border-color:#7d2137}
.sw.on i{left:23px;background:var(--red2)}

/* timer ring */
.ring{position:relative;width:236px;height:236px;margin:0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.clock{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--red2)}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:400}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* meters */
.meter{display:flex;align-items:center;gap:10px;margin:8px 0}
.meter .lab{width:104px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.meter .trk{flex:1;height:7px;background:#1e1a27;border-radius:99px;overflow:hidden}
.meter .trk>i{display:block;height:100%;background:linear-gradient(90deg,#7a0f27,#ff4d6d);border-radius:99px}
.meter .val{width:32px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim)}

/* lock */
.lockbox{width:80px;height:80px;margin:0 auto 16px;border-radius:24px;border:1px solid #43141f;
  background:linear-gradient(180deg,#1c0d13,#100b11);display:grid;place-items:center;font-size:33px;
  box-shadow:0 20px 50px -24px rgba(224,30,70,.9)}
.avatar{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px;
  font-family:var(--display);color:#0a0810}

/* motion */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes shk{0%,100%{transform:translate(0)}15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,-2px)}60%{transform:translate(5px,3px)}80%{transform:translate(-3px,1px)}}
@keyframes puls{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes wipe{from{transform:translateY(0)}to{transform:translateY(-101%)}}
@keyframes flick{0%,100%{opacity:1}44%{opacity:.3}47%{opacity:1}53%{opacity:.15}57%{opacity:1}}
@keyframes sweep{from{background-position:-160% 0}to{background-position:260% 0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.anim{animation:up .34s cubic-bezier(.2,.8,.3,1) both}
.anim2{animation:pop .3s cubic-bezier(.2,.9,.3,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.11s}.d3{animation-delay:.17s}.d4{animation-delay:.23s}
.shake{animation:shk .55s ease}
.puls{animation:puls 1.5s ease-in-out infinite}
.flick{animation:flick 1.2s steps(1) infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.shine{background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.22) 45%,transparent 70%);
  background-size:200% 100%;animation:sweep 2.4s ease-in-out infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
#wipe{position:fixed;inset:0;background:#07060a;z-index:90;pointer-events:none;display:none}
#wipe.go{display:block;animation:wipe .44s .2s cubic-bezier(.7,0,.2,1) forwards}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:95;background:#1d1926;border:1px solid var(--line2);
  padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;display:none;box-shadow:0 16px 40px -18px #000}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.noanim *{animation:none!important;transition:none!important}

/* ---------- noir / case-file layer ---------- */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:79;
  background:radial-gradient(120% 70% at 50% -6%, rgba(255,214,150,.055), transparent 52%),
             radial-gradient(110% 100% at 50% 46%, transparent 42%, rgba(0,0,0,.62) 100%)}
.lamp{position:fixed;top:-170px;left:50%;transform:translateX(-50%);width:560px;height:360px;pointer-events:none;z-index:0;
  background:conic-gradient(from 180deg at 50% 0%, transparent 0deg, rgba(255,208,140,.13) 17deg, rgba(255,208,140,.05) 27deg, transparent 42deg);
  filter:blur(16px)}
.case{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:#6a6476;text-transform:uppercase}
.tape{position:absolute;width:78px;height:21px;background:rgba(228,216,182,.10);border:1px solid rgba(228,216,182,.12);
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tape.tl{top:-10px;left:-13px;transform:rotate(-23deg)}
.tape.br{bottom:-10px;right:-13px;transform:rotate(-23deg)}
.scan{position:relative;overflow:hidden}
.scan::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.fp{position:absolute;right:10px;bottom:8px;width:82px;height:82px;opacity:.055;pointer-events:none}
@keyframes stampin{0%{transform:scale(2.7) rotate(-19deg);opacity:0}55%{transform:scale(.93) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:.94}}
.inkstamp{display:inline-block;border:3px double var(--red2);color:var(--red2);padding:9px 20px;border-radius:7px;
  font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:15px;
  transform:rotate(-8deg);opacity:.94;animation:stampin .55s cubic-bezier(.2,1.5,.4,1) both;
  box-shadow:inset 0 0 22px rgba(224,30,70,.18)}
.inkstamp.gr{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 22px rgba(49,209,127,.16)}
.board{position:relative;padding-left:30px}
.board .thread{position:absolute;left:5px;top:14px;bottom:14px;width:2px;
  background:linear-gradient(180deg,transparent,rgba(224,30,70,.55) 12%,rgba(224,30,70,.55) 88%,transparent)}
.board .ev{position:relative}
.board .ev::before{content:"";position:absolute;left:-30px;top:22px;width:11px;height:11px;border-radius:99px;
  background:var(--red);box-shadow:0 0 0 4px rgba(224,30,70,.16)}
.board .ev.blank::before{background:#3a3446;box-shadow:0 0 0 4px rgba(90,84,105,.14)}
.seal{width:96px;height:96px;margin:0 auto 18px;border-radius:99px;display:grid;place-items:center;font-size:34px;
  background:radial-gradient(circle at 34% 30%,#ff5f7d,#8e1029 62%,#5c0a1b);
  box-shadow:0 18px 44px -18px rgba(224,30,70,.95), inset 0 2px 10px rgba(255,255,255,.28), inset 0 -6px 14px rgba(0,0,0,.5)}
.file-tab{display:inline-block;padding:6px 14px 5px;border-radius:8px 8px 0 0;background:#1d1926;border:1px solid var(--line2);
  border-bottom:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin-left:14px}
.file-body{border-radius:0 var(--r) var(--r) var(--r);margin-top:-1px}
@keyframes cur{50%{border-color:transparent}}
.tw{display:inline-block;overflow:hidden;white-space:nowrap;border-right:2px solid var(--red2);
  animation:tw 1s steps(28) both, cur .7s step-end infinite;vertical-align:bottom}
@keyframes tw{from{width:0}to{width:100%}}
.grade{height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:14px 0;opacity:.5}

</style>
</head>
<body>
<div class="lamp"></div>
<div id="app"></div>
<div id="wipe"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   CONTENT — SCENARIOS
   tokens: {a} {b} {c} = random distinct players
   format: [title, seconds, body, optionalSecretsArray]
   ============================================================ */
const SCEN = [
/* ---------- FOOD / ORDERING IN ---------- */
["THE ORDER",240,"₹640 left in the shared pool and everyone is hungry.\n\nOne order. One restaurant. Decide what's coming and who gets the bigger portion.",["You already ate an hour ago. Nobody knows.","You are broke this week and cannot put in your share. Handle it.","You have a coupon that only works on one specific place."]],
["DELIVERY GUY IS DOWNSTAIRS",180,"He's been calling for six minutes. Somebody has to go down.\n\nIt is raining. Decide who, properly, with reasons."],
["THE MISSING BIRYANI",240,"One box of biryani left the fridge and did not come back.\n\nHold court. Someone is responsible and everyone knows it wasn't {a}. Probably."],
["SPLIT THE BILL",300,"Last month's food orders came to ₹4,860. Not everyone ate equally and everyone remembers it differently.\n\nSettle the whole month tonight."],
["MIDNIGHT MAGGI",120,"Two packets. Everyone's awake. Nobody wants to cook.\n\nDecide who cooks and who eats. Sixty seconds of arguing, then commit."],
["THE CHEAT MEAL",240,"{a} is on a cut and the group wants to order fried chicken.\n\nDecide as a group: do you order it, and does {a} get to veto?"],
["ZOMATO ROULETTE",180,"Nobody will pick. Everyone says 'anything'.\n\nYou must land on ONE cuisine with full agreement. 'Anything' is banned from this conversation."],
["THE TIP",120,"The delivery guy climbed four floors in the heat.\n\nDecide the tip and who pays it. Out of your own pocket, not the pool."],
["LEFTOVER RIGHTS",180,"There is exactly one portion of last night's order left.\n\nWho has the claim? Argue precedent. Past behaviour counts as evidence."],
["THE 2AM RUN",240,"Only one shop near the complex is still open.\n\nMake a list, agree a budget, and decide who walks. The person who walks picks the music for a week."],
["FOOD POISONING TRIAL",240,"Somebody's stomach is gone and everybody blames a different order.\n\nEstablish what happened and ban one place from the group forever."],
["THE SHARED PLATE",180,"One plate, several hands, no fairness.\n\nAgree a rule for shared food that will actually survive the week."],
/* ---------- WEED / BONG / SMOKE ---------- */
["BONG CLEANING DUTY",180,"The pipe is a crime scene and nobody has touched it in eleven days.\n\nDecide who cleans it. Bribery is fully legal here."],
["THE LAST OF THE STASH",300,"There is enough for one proper session, not three.\n\nDecide how it gets used tonight — and who gets left out, if anyone.",["You already have a backup you haven't mentioned.","You put in the most money last time and nobody acknowledged it.","You genuinely don't want any tonight but saying so early loses you leverage."]],
["WHO'S CRUSHING",120,"Somebody has to crush and nobody wants to.\n\nSettle it with an argument, not a coin. Whoever loses also finds the tobe."],
["THE LIGHTER CENSUS",180,"There were six lighters in this flat on Sunday. There are now zero.\n\nHold an inquiry. Somebody is a lighter black hole and the group must name them."],
["THE RUNS",240,"Somebody has to go make the run. It's late, it's a walk, and it's not fun.\n\nDecide who goes and what they get compensated with."],
["SESSION RULES",300,"Write three house rules for sessions that everyone must follow for a month.\n\nEach player holds one veto. Use it or lose it."],
["THE UNEVEN SPLIT",240,"Money in was uneven. Consumption was very uneven.\n\nRebalance it fairly. Everybody's memory of the last two weeks is suspiciously convenient."],
["FILTER SHORTAGE",120,"Down to two filters and there are more of you than that.\n\nDecide the priority order. Explain your reasoning out loud."],
["THE SMELL",180,"The neighbour's uncle asked a very pointed question in the lift today.\n\nDecide the cover story and who delivers it if it comes up again."],
["THE PACT",240,"Someone proposes a full month off. No sessions, nothing.\n\nDebate it seriously. It only counts if everybody signs."],
["ONE CIGARETTE",120,"One left in the pack. Three or more claimants.\n\nMake your case. No splitting it — that's cheating and everyone knows it."],
["ASH TRAY POLITICS",180,"There are ashes on the table, the sill, and one alarming place nobody wants to identify.\n\nAssign cleaning duty and one permanent rule."],
/* ---------- FIFA / GAMING ---------- */
["FIFA RANKINGS",240,"Settle it: rank everyone in this room at FIFA, best to worst, as a group.\n\nThe ranking is binding until somebody wins a rematch."],
["THE CONTROLLER",180,"One controller works properly. The other drifts left.\n\nDecide who gets the good one for the rest of the week."],
["THE TRANSFER WINDOW",300,"You're building one shared Ultimate Team with a limited budget.\n\nEach person must argue for one signing. Only two make it in.",["You know one of the picks under discussion is badly overrated. You can't prove it.","You genuinely don't follow football and are guessing. Hide it or use it.","You already have the best card and want the budget spent elsewhere."]],
["PENALTY SHOOTOUT LAW",180,"An argument about whether a goal counted has been going for twenty minutes.\n\nWrite a permanent house rule for disputes and get everyone to sign it."],
["MOURJYA DOESN'T KNOW OFFSIDE",240,"Someone in this room does not actually understand football and has been bluffing for months.\n\nRun the trial. Ask questions. Reach a verdict."],
["THE TOURNAMENT",300,"House tournament, one trophy, real stakes: winner is exempt from chores for two weeks.\n\nDecide the format, the seeding, and the handicaps. All must agree."],
["RAGE QUIT COURT",180,"Somebody disconnected while losing 3-0 and is claiming a network issue.\n\nEstablish the truth and set the punishment."],

/* ============================================================
   TRUST NO ONE — ROUND ENGINE
   ============================================================ */
function freshIdx(used,len){
 if(used.length>=len)used.length=0;
 let i,g=0;do{i=rnd(len);g++;}while(used.includes(i)&&g<300);
 used.push(i);return i;
}
function sub(text,map){
 return text.replace(/\{([abc])\}/g,(m,k)=>map[k]||"somebody");
}
function tokenMap(exclude){
 const pool=shuffle(G.players.map((p,i)=>i).filter(i=>!exclude||!exclude.includes(i)));
 const nm=i=>G.players[pool[i%pool.length]].name;
 return {a:nm(0),b:nm(1),c:nm(2)};
}
function diffOK(d){return G.mode==="psycho"?(d==="H"||d==="X"):true;}
function drawMission(mi){
 const others=G.players.map((p,i)=>i).filter(i=>i!==mi);
 let m=null;
 for(let t=0;t<90;t++){
  if(Math.random()<.2){const g=GENP.make();if(diffOK(g.d)){m={t:g.t,d:g.d,ctr:g.ctr,c:"GEN"};break;}continue;}
  const idx=freshIdx(G.uM,MIS.length),c=MIS[idx];
  if(!diffOK(c[1]))continue;
  if(G.mode==="chaos"&&c[1]==="E"&&Math.random()<.55)continue;
  m={t:c[0],d:c[1],ctr:c[2],c:c[3],auto:c[4]};break;
 }
 if(!m){const c=pick(MIS.filter(x=>diffOK(x[1])))||MIS[0];m={t:c[0],d:c[1],ctr:c[2],c:c[3],auto:c[4]};}
 const pr=shuffle(others);
 m.A=pr[0];m.B=pr[1]!==undefined?pr[1]:pr[0];
 m.text=m.t.replace(/\{a\}/g,G.players[m.A].name).replace(/\{b\}/g,G.players[m.B].name);
 m.owner=mi;m.done=undefined;
 return m;
}
function chooseManips(k){
 const min=Math.min(...G.mCount);
 let pool=shuffle(G.players.map((p,i)=>i).filter(i=>G.mCount[i]===min));
 const out=[];
 while(out.length<k){
  if(!pool.length)pool=shuffle(G.players.map((p,i)=>i).filter(i=>!out.includes(i)));
  const c=pool.shift();
  if(c===undefined)break;
  if(out.length===0&&G.last.length>=2&&G.last[G.last.length-1]===c&&G.last[G.last.length-2]===c&&pool.length){pool.push(c);continue;}
  out.push(c);
 }
 out.forEach(i=>G.mCount[i]++);
 G.last.push(out[0]);if(G.last.length>5)G.last.shift();
 return out;
}
function manipCount(){
 const n=N();
 let k=n<=5?1:2;
 if(G.mode==="double")k++;
 if(G.mode==="chaos"&&n>=9)k++;
 return clamp(k,1,Math.max(1,n-2));
}

function startRound(){
 G.round++;G.votes={};G.idx=0;G.pend=[];G.realIntel=[];G.res=null;
 const M=TMODES[G.mode];

 /* scenario */
 const si=freshIdx(G.uS,SCEN.length),raw=SCEN[si];
 const map=tokenMap();
 G.scen={t:raw[0],time:raw[1],d:sub(raw[2],map),sec:(raw[3]||[]).map(s=>sub(s,map))};
 G.twist=pick(TWISTS);
 G.case=caseNo();
 if(G.mode==="speed")G.scen.time=clamp(G.scen.time,60,120);
 else G.scen.time+=clamp((N()-4)*25,0,150);   /* bigger table, longer floor */

 /* chaos + event */
 G.chaos=Math.random()<M[2]?pick(CHAOS):null;
 G.ev=Math.random()<M[3]?pick(EVENTS):null;
 if(G.ev&&G.ev[0]==="short")G.scen.time=Math.max(60,Math.round(G.scen.time/2));

 /* roles */
 G.manips=chooseManips(manipCount());
 G.mis={};
 G.manips.forEach(mi=>{
  const list=[drawMission(mi)];
  if(G.ev&&G.ev[0]==="double"&&G.manips.length===1)list.push(drawMission(mi));
  G.mis[mi]=list;
 });
 const civs=G.players.map((p,i)=>i).filter(i=>!G.manips.includes(i));

 /* mini tasks */
 G.tasks={};
 if(!(G.ev&&G.ev[0]==="notasks")){
  civs.forEach(i=>{
   const ti=freshIdx(G.uT,TASKS.length),t=TASKS[ti];
   G.tasks[i]={t:t[0],d:t[1],done:undefined};
  });
 }

 /* intel: real counters -> some civilians; scenario secrets -> anyone; decoys -> rest */
 let realN=N()<=5?1:2;
 if(G.ev&&G.ev[0]==="reveal")realN++;
 realN=clamp(realN,1,civs.length);
 const holders=shuffle(civs).slice(0,realN);
 const allMis=G.manips.map(mi=>G.mis[mi][0]);
 G.intel={};
 holders.forEach((h,k)=>{const w=k%G.manips.length;
  G.intel[h]={txt:G.mis[G.manips[w]][0].ctr,real:true,vs:G.manips[w]};G.realIntel.push(h);});
 const secLeft=shuffle(G.scen.sec);
 const rest=shuffle(G.players.map((p,i)=>i).filter(i=>!holders.includes(i)));
 rest.forEach(i=>{
  const s=secLeft.pop();
  G.intel[i]={txt:s||pick(DECOY),real:false};
 });
 G.order=shuffle(G.players.map((p,i)=>i));
 G.players.forEach((p,i)=>{p.st.rounds++;if(G.manips.includes(i))p.st.manip++;else p.st.inn++;});
 SFX.lock();S.assign();
}

function tallyVotes(){

 /* an accusation only sticks if at least two people named the same person.
    everyone tied at the top goes on the board — a tie no longer protects anybody. */
 const accused=max>=2?top:[];
 return {t,max,top,accused,tie:top.length>1};
}

/* ---------- debrief ---------- */
function autoCheck(m){
 const o=m.owner,others=G.players.map((p,i)=>i).filter(i=>i!==o);
 const against=others.filter(x=>G.votes[x]===o).length;
 const {accused}=tallyVotes();
 switch(m.auto){
  case "noVotes":return against===0;
  case "aVotesB":return G.votes[m.A]===m.B;
  case "sameWrong":{const t={};others.forEach(x=>{if(G.votes[x]!==o)t[G.votes[x]]=(t[G.votes[x]]||0)+1;});return Math.max(0,...Object.values(t))>=2;}
  case "exactlyOne":return against===1;
  case "someNotMost":return against>=1&&!accused.includes(o);
 }
 return false;
}

/* ---------- scoring ---------- */
function scoreRound(){
 const delta=G.players.map(()=>0),notes=G.players.map(()=>[]);
 const {t:tal,accused}=tallyVotes();
 const caught=i=>accused.includes(i);
 const framed=accused.length>0&&accused.every(x=>!G.manips.includes(x));

 G.manips.forEach(mi=>{
  const p=G.players[mi],ms=G.mis[mi];
  const anyDone=ms.some(m=>m.done),allDone=ms.every(m=>m.done);
  ms.forEach(m=>{if(m.done){
   delta[mi]+=3;notes[mi].push("Agenda done +3");p.st.done++;
   const ex=DIFF[m.d][3];if(ex){delta[mi]+=ex;notes[mi].push(DIFF[m.d][0]+" +"+ex);p.st.hard++;}
  }});
  if(!caught(mi)){
   if(anyDone){delta[mi]+=3;notes[mi].push("Never caught +3");}
   else{delta[mi]+=1;notes[mi].push("Walked away +1");}
   p.st.clean++;
   if(framed){delta[mi]+=2;notes[mi].push("Innocent on the board +2");p.st.misdir++;p.st.chaos++;}
  }else notes[mi].push("Caught by the room +0");
  p.st.pers+=(anyDone?2:0)+(framed?2:0);
  if(allDone&&!caught(mi))p.st.betray++;
 });

 const civs=G.players.map((p,i)=>i).filter(i=>!G.manips.includes(i));
 const right=civs.filter(i=>G.manips.includes(G.votes[i]));
 civs.forEach(i=>{
  const p=G.players[i];
  if(G.manips.includes(G.votes[i])){
   delta[i]+=3;notes[i].push("Named an agenda +3");p.st.correct++;
   if(right.length===1){delta[i]+=2;notes[i].push("Only one who saw it +2");}
   if(G.rev===i){delta[i]+=2;notes[i].push("Revenge +2");}
  }else{notes[i].push("Wrong name +0");p.st.wrong++;}
  const tk=G.tasks[i];
  if(tk&&tk.done){const b=DIFF[tk.d][2];delta[i]+=b;notes[i].push("Mini task +"+b);p.st.tasks++;}
  const vs=G.intel[i]&&G.intel[i].vs;
  if(vs!==undefined&&vs!==null&&G.mis[vs]&&G.mis[vs].every(x=>!x.done)){
   delta[i]+=2;notes[i].push("Counter-intel held +2");
  }
 });
 if(civs.length>1&&right.length*2>civs.length)right.forEach(i=>{delta[i]+=1;notes[i].push("Room read it +1");});

 G.players.forEach((p,i)=>{
  const got=tal[i]||0;p.st.votesGot+=got;
  if(!G.manips.includes(i))p.st.suspInn+=got;
 });

 const victim=civs.find(i=>!G.manips.includes(G.votes[i])&&G.manips.some(m=>G.mis[m].some(x=>x.done)));
 G.rev=victim!==undefined?victim:null;
 delta.forEach((d,i)=>{G.players[i].score+=d;});

 const m0=G.manips[0],doneM=G.mis[m0].some(x=>x.done),cau=caught(m0);
 let badge,col;
 if(doneM&&!cau){badge="\ud83d\udd34 FULL MANIPULATOR WIN";col="var(--red2)";}
 else if(doneM&&cau){badge="\ud83d\udfe1 PARTIAL WIN \u2014 DONE BUT CAUGHT";col="var(--gold)";}
 else if(!doneM&&!cau){badge="\ud83d\udd35 WALKED AWAY, AGENDA FAILED";col="var(--blue)";}
 else{badge="\ud83d\udfe2 THE ROOM WINS";col="var(--green)";}

 G.hist.push({r:G.round,sc:G.scen.t,cs:G.case,ch:G.chaos?G.chaos[0]:null,ev:G.ev?G.ev[1]:null,
  manips:G.manips.slice(),mis:G.manips.map(i=>G.mis[i].map(m=>({t:m.text,d:m.d,done:!!m.done}))),
  tasks:Object.keys(G.tasks).map(i=>({i:+i,t:G.tasks[i].t,done:!!G.tasks[i].done})),
  votes:Object.assign({},G.votes),accused:accused.slice(),delta:delta.slice(),badge,caught:cau});
 store.set("rounds",store.get("rounds",0)+1);

function pc(a,b){return b>0?Math.round(clamp(a/b,0,1)*100):0;}
function meters(p){const s=p.st;return {
 "TRUSTED":pc(Math.max(0,s.inn*2-s.suspInn),Math.max(1,s.inn*2)),
 "DECEPTION":pc(s.done,Math.max(1,s.manip)),
 "DETECTION":pc(s.correct,Math.max(1,s.inn)),
 "CHAOS":pc(s.misdir+s.wrong,Math.max(1,s.rounds*2)),
 "PERSUASION":pc(s.pers,Math.max(1,s.manip*4)),
 "DILIGENCE":pc(s.tasks,Math.max(1,s.inn))};}
function titles(){
 const used=new Set(),out=[];
 shuffle(TITLES).forEach(t=>{
  if(out.length>=Math.min(5,N()))return;
  const r=G.players.map((p,i)=>({i,v:t[3](p)})).filter(x=>!used.has(x.i)&&x.v>=t[4]).sort((a,b)=>b.v-a.v);
  if(r.length){used.add(r[0].i);out.push({i:r[0].i,t});}
 });
 return out;
}
function roast(p){const s=p.st;
 if(s.manip&&s.clean/s.manip>=.7&&s.done>=2)return pick(ROAST.clean);
 if(s.manip>=2&&s.clean/Math.max(1,s.manip)<=.34)return pick(ROAST.caught);
 if(s.inn&&s.correct/Math.max(1,s.inn)>=.65)return pick(ROAST.sniper);
 if(s.wrong>=3&&s.correct<=1)return pick(ROAST.gullible);
 if(s.tasks>=3&&s.correct<=1)return pick(ROAST.tasks);
 if(s.suspInn<=1&&s.inn>=2)return pick(ROAST.quiet);
 return pick(ROAST.mid);
}

   if(p.role==="doc"&&sel!==null)M.night.save=sel;
   if(p.role==="cop"&&sel!==null){M.night.check=sel;return wipeTo(()=>S.copRes(sel));}
   M.idx++;wipeTo(()=>M.idx<M.order.length?S.nHand():S.dawn());
  };
 });
};
S.copRes=(t)=>{
 const isImp=MROLES[M.players[t].role].team==="mafia";
 render(`<div class="anim ctr" style="padding-top:60px">
 <div class="kick">investigation result</div>
 <div style="margin:22px 0 10px">${avatar(t,M.players[t].name,84)}</div>
 <h2 class="tL" style="margin:8px 0 14px">${esc(M.players[t].name)}</h2>
 <div class="card ${isImp?"hot":"cool"}" style="max-width:320px;margin:0 auto">
  <div class="tM" style="color:${isImp?"var(--red2)":"var(--blue)"}">${isImp?"🔪 IMPOSTER":"🙂 NOT AN IMPOSTER"}</div>
  <p class="sm" style="margin:10px 0 0">${isImp?"They are on the other side. Getting the room to believe you is a different problem.":"Clean, as far as tonight goes. That includes the Jester, if there's one."}</p></div>
 <div class="gap lg"></div><button class="btn p" id="g">Memorise it &amp; pass on</button></div>`,()=>{
  $("#g").onclick=()=>{SFX.lock();M.idx++;wipeTo(()=>M.idx<M.order.length?S.nHand():S.dawn());};
 });
};
S.dawn=()=>{
 const picks=Object.values(M.night.picks);
 let victim=null;
 if(picks.length){
  const c={};picks.forEach(v=>c[v]=(c[v]||0)+1);
  const mx=Math.max(...Object.values(c));
  victim=+pick(Object.keys(c).filter(k=>c[k]===mx));
 }
 let saved=false;
 if(victim!==null&&M.night.save===victim){saved=true;victim=null;}
 if(victim!==null)M.players[victim].alive=false;
 M.log.push({night:M.day,victim,saved});
 const over=mCheckWin();
 render(`<div class="anim ctr" style="padding-top:56px">
 <div style="font-size:46px">${victim!==null?"💀":"☀️"}</div>
 <div class="kick" style="margin-top:14px">morning ${M.day}</div>
 ${victim!==null?`<div style="margin:20px 0 6px">${avatar(victim,M.players[victim].name,84)}</div>
  <h2 class="tL shake" style="margin:10px 0 14px">${esc(M.players[victim].name)}</h2>
  <p class="lede">${pick(MDEATH)}</p>
  <div class="card t" style="margin-top:18px"><div class="kick">they were</div>
   <div class="tM" style="color:${MROLES[M.players[victim].role].c};margin-top:8px">${MROLES[M.players[victim].role].e} ${MROLES[M.players[victim].role].n}</div></div>`
 :`<h2 class="tL" style="margin:18px 0 14px">Nobody died.</h2><p class="lede">${pick(MSAVED)}</p>`}
 <div class="rule"></div>
 <div class="wrap" style="justify-content:center">${M.players.map((p,i)=>chip(i,p.name,!p.alive)).join("")}</div>
 <div class="gap lg"></div>
 <button class="btn p" id="g">${over?"See how it ended":"Open the floor"}</button></div>`,()=>{
  victim!==null?SFX.fail():SFX.win();
  $("#g").onclick=()=>{SFX.flip();wipeTo(()=>over?S.mOver(over):S.mDisc());};
 });
};
function mCheckWin(){
 const m=mafiaAlive().length,tot=aliveIdx().length;
 if(m===0)return {w:"town",t:"THE FLAT WINS"};
 if(m*2>=tot)return {w:"mafia",t:"THE IMPOSTERS WIN"};
 return null;
}
S.mDisc=()=>{
 let left=MD.time,total=MD.time,paused=false;const R=104,C=2*Math.PI*R;
 render(`<div class="anim ctr" style="padding-top:8px">
 <div class="kick">day ${M.day} · discussion</div>
 <div class="ring" style="margin-top:16px">
  <svg width="236" height="236" viewBox="0 0 236 236">
   <circle cx="118" cy="118" r="${R}" fill="none" stroke="#1e1a27" stroke-width="9"/>
   <circle id="arc" cx="118" cy="118" r="${R}" fill="none" stroke="url(#gr2)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}"/>
   <defs><linearGradient id="gr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a97bff"/><stop offset="100%" stop-color="#ff4d6d"/></linearGradient></defs></svg>
  <div class="mid"><div><div class="clock" id="ck">${mmss(left)}</div><div class="xs ctr" style="margin-top:6px">${aliveIdx().length} alive</div></div></div></div>
 <p class="lede" style="margin-top:18px">Accuse. Defend. Somebody hangs at the end of this.</p>
 <div class="wrap" style="justify-content:center;margin-top:16px">${M.players.map((p,i)=>chip(i,p.name,!p.alive)).join("")}</div>
 <div class="row" style="margin-top:18px"><button class="btn s" id="pz">Pause</button><button class="btn s" id="pl">+1 min</button></div>
 <div class="gap"></div><button class="btn p" id="en">Go to the vote</button></div>`,()=>{
  const ck=$("#ck"),arc=$("#arc"),draw=()=>arc.setAttribute("stroke-dashoffset",String(C*(1-left/total)));
  draw();
  TIMER=setInterval(()=>{if(paused)return;left--;
   if(left<=0){clearInterval(TIMER);SFX.alert();return S.mVoteStart();}
   ck.textContent=mmss(left);draw();
   if(left<=10){ck.classList.add("warn");SFX.tick();}else if(left<=30&&left%5===0)SFX.tick();},1000);
  $("#pz").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause";SFX.tap();};
  $("#pl").onclick=()=>{left+=60;total+=60;ck.textContent=mmss(left);draw();toast("+1 minute");};
  $("#en").onclick=()=>{clearInterval(TIMER);SFX.lock();S.mVoteStart();};
 });
};
S.mVoteStart=()=>{M.votes={};M.idx=0;M.order=shuffle(aliveIdx());wipeTo(()=>S.mVH());};
S.mVH=()=>{
 const i=M.order[M.idx],p=M.players[i];
 render(`<div class="ctr anim" style="padding-top:52px">${avatar(i,p.name,84)}
 <div class="kick" style="margin-top:6px">pass the phone to</div>
 <h2 class="tXL" style="margin:12px 0 20px;font-size:clamp(36px,12vw,54px)">${esc(p.name)}</h2>
 <button class="btn p" id="g">I'm ${esc(p.name)}</button>
 <div class="xs" style="margin-top:14px">${M.idx+1} of ${M.order.length}</div></div>`,()=>{
  $("#g").onclick=()=>{SFX.flip();wipeTo(()=>S.mVote());};
 });
};
S.mVote=()=>{
 const i=M.order[M.idx];let sel=null;
 render(`<div class="anim">
 <div class="card hot" style="padding:12px 14px;margin-bottom:16px"><div style="display:flex;align-items:center;gap:11px">
  ${avatar(i,M.players[i].name,40)}<div><div class="kick red">sealed ballot</div><div class="tS">${esc(M.players[i].name)} only.</div></div></div></div>
 <h2 class="tL">Who hangs?</h2>
 <div class="stack tight" style="margin-top:16px">
 ${aliveIdx().filter(k=>k!==i).map(k=>`<button class="btn" data-v="${k}"><div class="l"><span style="display:flex;align-items:center;gap:10px">
  <span class="dot" style="background:${PC[k%PC.length]}"></span>${esc(M.players[k].name)}</span></div></button>`).join("")}
 <button class="btn gh" data-v="-1">Abstain — nobody</button></div>
 <div class="gap"></div><button class="btn p" id="lk" disabled>Lock it in</button></div>`,()=>{
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
   sel=+b.dataset.v;SFX.tap();
   document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("sel",x===b));$("#lk").disabled=false;});
  $("#lk").onclick=()=>{if(sel===null)return;if(sel>=0)M.votes[i]=sel;SFX.lock();M.idx++;
   wipeTo(()=>M.idx<M.order.length?S.mVH():S.mVoteRes());};
 });
};
S.mVoteRes=()=>{
 const t={};Object.values(M.votes).forEach(v=>t[v]=(t[v]||0)+1);
 const mx=Math.max(0,...Object.values(t));
 const top=Object.keys(t).filter(k=>t[k]===mx).map(Number);
 const elim=(mx>0&&top.length===1)?top[0]:null;
 if(elim!==null)M.players[elim].alive=false;
 const jester=elim!==null&&M.players[elim].role==="jest";
 const over=jester?{w:"jester",t:"THE JESTER WINS",who:elim}:mCheckWin();
 render(`<div class="anim ctr" style="padding-top:40px">
 <div class="kick">the vote</div>
 <div class="wrap" style="justify-content:center;margin:16px 0">${Object.keys(t).map(k=>`<span class="pill ${+k===elim?"rd":""}">${esc(M.players[k].name)} · ${t[k]}</span>`).join("")||`<span class="pill">everybody abstained</span>`}</div>
 ${elim!==null?`<div style="margin:12px 0 6px">${avatar(elim,M.players[elim].name,84)}</div>
  <h2 class="tL shake" style="margin:10px 0 12px">${esc(M.players[elim].name)} is out</h2>
  <div class="card ${MROLES[M.players[elim].role].team==="mafia"?"hot":"cool"}" style="max-width:330px;margin:0 auto">
   <div class="kick">they were</div><div class="tM" style="margin-top:8px;color:${MROLES[M.players[elim].role].c}">${MROLES[M.players[elim].role].e} ${MROLES[M.players[elim].role].n}</div></div>`
 :`<h2 class="tL" style="margin:16px 0 12px">Tie. Nobody hangs.</h2><p class="lede">The flat couldn't agree. Night falls anyway.</p>`}
 <div class="rule"></div>
 <div class="wrap" style="justify-content:center">${M.players.map((p,i)=>chip(i,p.name,!p.alive)).join("")}</div>
 <div class="gap lg"></div>
 <button class="btn p" id="g">${over?"See how it ended":"Night falls"}</button></div>`,()=>{
  elim!==null&&MROLES[M.players[elim].role].team==="mafia"?SFX.win():SFX.fail();
  $("#g").onclick=()=>{SFX.flip();wipeTo(()=>over?S.mOver(over):S.night());};
 });
};
S.mOver=(res)=>{
 const winners=res.w==="jester"?[res.who]
  :M.players.map((p,i)=>i).filter(i=>MROLES[M.players[i].role].team===(res.w==="mafia"?"mafia":"town")&&M.players[i].role!=="jest");
 render(`<div class="anim ctr" style="padding-top:44px">
 <div class="kick">game over · ${M.day} night${M.day>1?"s":""}</div>
 <h2 class="tXL" style="margin:16px 0 10px;font-size:clamp(34px,11vw,52px);color:${res.w==="mafia"?"var(--red2)":res.w==="jester"?"var(--violet)":"var(--green)"}">${res.t}</h2>
 <p class="lede">${res.w==="mafia"?"They outnumbered the flat. It was over before the last vote.":res.w==="jester"?"You hanged the one person who wanted it. Congratulations, everyone.":"Every imposter is out. The flat holds."}</p>
 <div class="rule"></div><div class="kick">everybody's cards</div>
 <div class="stack tight" style="margin-top:12px;text-align:left">
 ${M.players.map((p,i)=>{const R=MROLES[p.role];const w=winners.includes(i);
  return `<div class="card ${w?"gld":"t"}" style="padding:14px"><div class="sp">
  <span class="tS" style="display:flex;align-items:center;gap:9px"><span class="dot" style="background:${PC[i%PC.length]}"></span>${esc(p.name)}${p.alive?"":" 💀"}</span>
  <span class="pill" style="color:${R.c};border-color:${R.c}55">${R.e} ${R.n}</span></div>
  ${w?`<div class="xs gold" style="margin-top:6px">winner</div>`:""}</div>`;}).join("")}</div>
 <div class="gap lg"></div>
 <div class="stack"><button class="btn p" id="ag">🔥 Run it back</button>
 <button class="btn" data-go="msetup">Change the line-up</button>
 <button class="btn gh" data-go="home">Main menu</button></div></div>`,()=>{
  SFX.win();
  $("#ag").onclick=()=>{mNew(M.players.map(p=>p.name));SFX.rev();wipeTo(()=>S.mIntro());};
 });
};

/* ============================================================
   SOLO DOSSIER (1–2 people)
   ============================================================ */
S.solo=()=>{
 const m=pick(MIS),sc=SCEN[rnd(SCEN.length)];
 const nm=D.names.filter(Boolean);
 const map={a:nm[1]||"your roommate",b:nm[2]||"the other one",c:nm[3]||"whoever's around"};
 const text=m[0].replace(/\{a\}/g,map.a).replace(/\{b\}/g,map.b);
 render(`${head("SOLO DOSSIER",`<button class="icb" data-go="home">Back</button>`)}
 <div class="anim"><h2 class="tL">One agenda.<br>No game required.</h2>
 <p class="sm" style="margin:12px 0 18px">Not enough people for a real round? Take a mission and run it on the flat anyway. Nobody else has to know this screen exists.</p>
 <div class="card t"><div class="kick">tonight's setting</div>
  <h3 class="tM" style="margin:8px 0 10px">${esc(sc[0])}</h3>
  <p class="sm" style="margin:0;white-space:pre-line">${esc(sub(sc[2],map))}</p></div>
 <div style="height:12px"></div>
 <div class="dossier"><span class="stamp">EYES ONLY</span><div class="kick">your mission · ${DIFF[m[1]][1]} ${DIFF[m[1]][0]}</div>
  <p style="margin:10px 0 0;font-size:18px;line-height:1.45">${esc(text)}</p></div>
 <div style="height:12px"></div>
 <div class="card cool"><div class="kick blue">how they'd stop you</div><p class="sm" style="margin:8px 0 0">${esc(m[2])}</p></div>
 <div class="gap lg"></div>
 <div class="row"><button class="btn s p" id="re">Another mission</button><button class="btn s gh" data-go="setup">Play properly</button></div></div>`,()=>{
  $("#re").onclick=()=>{SFX.flip();S.solo();};
 });
};

/* ============================================================
   ROUTER + BOOT
   ============================================================ */
function go(name){
 clearInterval(TIMER);
 const map={home:S.home,howto:S.howto,modes:S.modes,settings:S.settings,stats:S.stats,
  setup:S.setup,tutorial:()=>S.tut(0),msetup:S.msetup,solo:S.solo,brief:S.brief,
  res:()=>{G&&G.res?S.res():S.home();}};
 (map[name]||S.home)();
}
/* Android hardware back button bridge (see MainActivity.java) */
window.__androidBack=function(){
 if(window.__atHome)return false;
 clearInterval(TIMER);S.home();window.__atHome=true;return true;
};
if(store.get("noanim",false))document.body.classList.add("noanim");
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&document.activeElement.tagName!=="INPUT"){
  const b=document.querySelector(".btn.p:not([disabled])");if(b)b.click();}
});
window.addEventListener("error",()=>{});
S.home();

</script>
</body>
</html>
